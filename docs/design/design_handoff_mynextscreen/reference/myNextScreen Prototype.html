<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo" data-density="regular">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myNextScreen — Redesign Prototype</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* responsive collapses for the dashboard grids */
    @media (max-width: 1100px) {
      .main-grid { grid-template-columns: 1fr !important; }
      .kpi-row { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 560px) {
      .kpi-row { grid-template-columns: 1fr !important; }
      .metric-row { grid-template-columns: repeat(2, 1fr) !important; }
    }
    /* login: collapse brand panel on narrow viewports */
    @media (max-width: 880px) {
      .auth-brand { display: none !important; }
      .auth-mini-logo { display: flex !important; }
    }
    /* instance admin responsive collapses */
    @media (max-width: 1100px) {
      .adm-kpi { grid-template-columns: repeat(2, 1fr) !important; }
      .adm-two { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 560px) {
      .adm-kpi { grid-template-columns: 1fr !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="admin_data.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="dashboard_widgets.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="auth.jsx"></script>
  <script type="text/babel" src="modals.jsx"></script>

  <script type="text/babel" src="audit.jsx"></script>
  <script type="text/babel" src="streams.jsx"></script>
  <script type="text/babel" src="playlists.jsx"></script>
  <script type="text/babel" src="schedules.jsx"></script>
  <script type="text/babel" src="groups.jsx"></script>
  <script type="text/babel" src="content.jsx"></script>
  <script type="text/babel" src="settings.jsx"></script>
  <script type="text/babel" src="admin.jsx"></script>

</body>
</html>
