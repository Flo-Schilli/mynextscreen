<!--
  myNextScreen launcher icon.

  Drawn as flat geometry on purpose: an LG launcher renders this at 80 px on a
  screen people look at from across a room, where the detailed brand
  illustration turns to mush. Two screens carry the name, the teal-to-amber
  gradient carries the brand.

  Regenerate the PNGs after editing — see ICONS_README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="130" height="130">
  <defs>
    <linearGradient id="screenFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.55" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="80" height="80" rx="16" fill="#0f1218" />

  <!-- the next screen, behind -->
  <rect
    x="30"
    y="13"
    width="38"
    height="27"
    rx="4"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="3.5"
    opacity="0.45"
  />

  <!-- this screen, in front -->
  <rect x="12" y="25" width="45" height="32" rx="5" fill="url(#screenFill)" />
  <rect x="31" y="57" width="7" height="5" fill="url(#screenFill)" />
  <rect x="23" y="62" width="23" height="4.5" rx="2.25" fill="url(#screenFill)" />
</svg>
