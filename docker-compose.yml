services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./test-data/media:/app/media
    environment:
      - DATABASE_URL=postgres://signage:signage@postgres:5432/signage
      - REDIS_URL=redis://redis:6379
      - MEDIA_BASE_PATH=/app/media
      - MAX_FILE_SIZE_BYTES=1073741824
      - FFMPEG_VIDEO_CRF=18
      - FFMPEG_VIDEO_PRESET=slow
      - FFMPEG_VIDEO_MAXRATE=8M
      - FFMPEG_VIDEO_BUFSIZE=16M
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev-insecure-secret-change-me}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-30d}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-strict}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS:-}
      - SUPER_ADMIN_INITIAL_PASSWORD=${SUPER_ADMIN_INITIAL_PASSWORD:-}
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/proxy.conf.docker.json:/app/proxy.conf.docker.json

  player:
    build:
      context: ./player
      dockerfile: Dockerfile
    ports:
      - "4300:4300"
    volumes:
      - ./player/src:/app/src
      - ./player/proxy.conf.docker.json:/app/proxy.conf.docker.json

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=signage
      - POSTGRES_PASSWORD=signage
      - POSTGRES_DB=signage
    volumes:
      - signage-postgres-data:/var/lib/postgresql/data

volumes:
  signage-postgres-data:


