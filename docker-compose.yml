services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./test-data/data:/app/data
      - ./test-data/media:/app/media
    environment:
      - DATABASE_PATH=/app/data/signage.db
      - REDIS_URL=redis://redis:6379
      - MEDIA_BASE_PATH=/app/media
      - MAX_FILE_SIZE_BYTES=1073741824
      - FFMPEG_VIDEO_CRF=18
      - FFMPEG_VIDEO_PRESET=slow
      - FFMPEG_VIDEO_MAXRATE=8M
      - FFMPEG_VIDEO_BUFSIZE=16M
      - HANKO_API_URL=${HANKO_API_URL:?set HANKO_API_URL in .env (copy from .env.example)}
      - SUPER_ADMIN_USER_IDS=${SUPER_ADMIN_USER_IDS:-}
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/proxy.conf.docker.json:/app/proxy.conf.docker.json

  player:
    build:
      context: ./player
      dockerfile: Dockerfile
    ports:
      - "4300:4300"
    volumes:
      - ./player/src:/app/src
      - ./player/proxy.conf.docker.json:/app/proxy.conf.docker.json

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"


