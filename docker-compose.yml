services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - db-data:/app/data
      - media-data:/app/media
    environment:
      - DATABASE_PATH=/app/data/signage.db
      - REDIS_URL=redis://redis:6379
      - MEDIA_BASE_PATH=/app/media
      - HANKO_API_URL=https://d4c70f6b-088c-4080-96c7-f53645649006.hanko.io
      - SUPER_ADMIN_USER_IDS=3dd344f0-6349-405b-8710-2905aefdac30
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/proxy.conf.docker.json:/app/proxy.conf.docker.json

  player:
    build:
      context: ./player
      dockerfile: Dockerfile
    ports:
      - "4300:4300"
    volumes:
      - ./player/src:/app/src
      - ./player/proxy.conf.docker.json:/app/proxy.conf.docker.json

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db-data:
  media-data:
