<div class="flex min-h-screen items-center justify-center bg-bg-primary px-4">
  <div class="w-full max-w-sm rounded-lg border border-border bg-bg-secondary p-8 shadow-lg">
    <h1 class="mb-6 text-center text-2xl font-semibold text-text-primary">Verify your email</h1>

    @if (state() === 'verifying') {
      <p class="text-center text-sm text-text-secondary">Verifying your email…</p>
    } @else {
      <div class="space-y-4 text-center">
        <p class="text-sm text-red-400" role="alert">
          This verification link is invalid or has expired.
        </p>

        @if (resent()) {
          <p class="text-sm text-text-secondary">
            If that account needs verifying, a new link is on its way.
          </p>
        } @else {
          <button
            type="button"
            [disabled]="resending()"
            (click)="resend()"
            class="w-full rounded-md bg-accent px-4 py-2 font-medium text-white hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-60"
          >
            {{ resending() ? 'Sending…' : 'Resend verification email' }}
          </button>
        }

        <a
          href="/login"
          class="inline-block text-sm font-medium text-accent hover:text-accent-hover"
          >Back to sign in</a
        >
      </div>
    }
  </div>
</div>
