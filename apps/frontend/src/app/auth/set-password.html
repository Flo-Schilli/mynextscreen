<div class="flex min-h-screen items-center justify-center bg-bg-primary px-4">
  <div class="w-full max-w-sm rounded-lg border border-border bg-bg-secondary p-8 shadow-lg">
    <h1 class="mb-6 text-center text-2xl font-semibold text-text-primary">Set your password</h1>

    @if (!hasToken()) {
      <p class="text-sm text-red-400" role="alert">
        Missing or invalid activation link. Ask an administrator to re-invite you.
      </p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label for="newPassword" class="mb-1 block text-sm font-medium text-text-secondary">
            New password
          </label>
          <input
            id="newPassword"
            type="password"
            formControlName="newPassword"
            autocomplete="new-password"
            class="w-full rounded-md border border-border bg-bg-primary px-3 py-2 text-text-primary placeholder:text-text-muted focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
          />
          @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
            <p class="mt-1 text-sm text-red-400">Use at least 8 characters.</p>
          }
        </div>

        @if (error()) {
          <p class="text-sm text-red-400" role="alert">{{ error() }}</p>
        }

        <button
          type="submit"
          [disabled]="submitting()"
          class="w-full rounded-md bg-accent px-4 py-2 font-medium text-white hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-60"
        >
          {{ submitting() ? 'Saving…' : 'Set password' }}
        </button>
      </form>
    }
  </div>
</div>
