<div class="flex min-h-screen items-center justify-center bg-bg-primary px-4">
  <div class="w-full max-w-sm rounded-lg border border-border bg-bg-secondary p-8 shadow-lg">
    <h1 class="mb-6 text-center text-2xl font-semibold text-text-primary">Signage Server</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium text-text-secondary">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          class="w-full rounded-md border border-border bg-bg-primary px-3 py-2 text-text-primary placeholder:text-text-muted focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-1 text-sm text-red-400">Enter a valid email address.</p>
        }
      </div>

      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-text-secondary"
          >Password</label
        >
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full rounded-md border border-border bg-bg-primary px-3 py-2 text-text-primary placeholder:text-text-muted focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <p class="mt-1 text-sm text-red-400">Password is required.</p>
        }
      </div>

      @if (error()) {
        <p class="text-sm text-red-400" role="alert">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-md bg-accent px-4 py-2 font-medium text-white hover:bg-accent-hover disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <div class="mt-6 flex justify-center">
      <app-version-badge />
    </div>
  </div>
</div>
