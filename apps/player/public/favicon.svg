<!--
  myNextScreen favicon. Source for favicon.ico — see ICONS.md next to it.

  Optically sized for 16 px: the front screen is larger and the stand heavier
  than in the webOS launcher icon, which has 80 px to play with. Same drawing,
  different distance.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="screenFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.55" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="80" height="80" rx="16" fill="#0f1218" />

  <!-- the next screen, behind -->
  <rect
    x="33"
    y="11"
    width="37"
    height="26"
    rx="4"
    fill="none"
    stroke="#2dd4bf"
    stroke-width="4.5"
    opacity="0.5"
  />

  <!-- this screen, in front -->
  <rect x="9" y="24" width="48" height="34" rx="5" fill="url(#screenFill)" />
  <rect x="29" y="58" width="8" height="6" fill="url(#screenFill)" />
  <rect x="20" y="63" width="26" height="5.5" rx="2.75" fill="url(#screenFill)" />
</svg>
