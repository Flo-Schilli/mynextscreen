name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-test-build:
    name: lint · typecheck · test · build (nx affected)
    runs-on: ubuntu-latest
    permissions:
      contents: read # coverage gate is enforced in apps/backend/jest.config.ts; no PR-comment action
      pull-requests: read # gitleaks lists the PR's commits to scan only its diff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so nx-set-shas can resolve the affected base

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          # Match the npm pinned in package.json: the lockfile is written by it
          # and npm 10 (the version bundled with Node 22) cannot install it.
          npm i -g npm@11.6.2
          npm ci

      - name: Check version sync
        run: node scripts/sync-versions.mjs --check

      # Scans the diff of this push/PR, not the whole history — the history was
      # audited once before the repository went public. Catches a credential
      # before it is committed to a repository anyone can clone. No licence key:
      # gitleaks-action is free for personal accounts and only charges for
      # organisation-owned repositories.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A finding fails the step, which is the signal. Writing it into a PR
          # review comment would need a write-scoped token and would reproduce
          # the secret in the timeline of a public repository.
          GITLEAKS_ENABLE_COMMENTS: false

      # Deliberately limited to production dependencies: the build toolchain
      # (Nx, Angular CLI, Vite, webpack-dev-server) carries advisories that never
      # reach a shipped image, and letting that noise fail the build would train
      # everyone to ignore this step.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Derives NX_BASE / NX_HEAD for `nx affected` from the merge base with the
      # target branch. Only needed on PRs — push events (main/tags) run `nx
      # run-many`, which ignores these SHAs. Gating on PRs also avoids the
      # workflow-runs API call that nx-set-shas makes on push events, which needs
      # `actions: read` the job does not grant ("Resource not accessible by
      # integration") and which broke the first tag/main release build.
      - name: Derive nx SHAs
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5

      # On the default branch we run the full graph (run-many) so nothing is skipped;
      # on PRs we run only what the change set affects.
      - name: Format check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t format:check
          else
            npx nx run-many -t format:check
          fi

      - name: Lint · typecheck · build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t lint typecheck build
          else
            npx nx run-many -t lint typecheck build
          fi

      # Backend Jest enforces the coverage gate (92/83/84/92) inside jest.config.ts,
      # so a regression fails this step. Frontend uses ng test (Vitest), player vitest.
      - name: Test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t test
          else
            npx nx run-many -t test
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # One job per app *and* architecture, each on a runner of that architecture.
  # Emulated arm64 would mean building two Angular applications under QEMU; the
  # arm runners are native and free for public repositories.
  #
  # Each job pushes only a digest, with no tags. The `manifest` job below joins
  # the two digests of an app into one multi-architecture tag, so `podman pull`
  # resolves the right image on its own.
  docker:
    name: docker (${{ matrix.app }}/${{ matrix.arch }})
    needs: lint-test-build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, player]
        arch: [amd64, arm64]
        # `arch` is a matrix key, so each entry matches the combinations with
        # that value and only adds the runner to them.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image path + version metadata
        id: meta
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="${PKG_VERSION}+sha.${SHORT_SHA}"
          fi
          {
            echo "image=$(echo 'ghcr.io/${{ github.repository }}/${{ matrix.app }}' | tr '[:upper:]' '[:lower:]')"
            echo "app_version=${APP_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # Build and package the LG webOS player app (.ipk) so it can be served
      # from the backend image. amd64 only: the artefact is architecture
      # independent and building it twice would only duplicate it.
      - name: Build LG TVOS IPK
        if: matrix.app == 'backend' && matrix.arch == 'amd64'
        run: |
          npm install -g @webos-tools/cli@3.2.6
          mkdir -p player-applications/lg-tvos/dist
          ares-package player-applications/lg-tvos --outdir player-applications/lg-tvos/dist

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prod images build from the repo-root context (monorepo); the Dockerfile lives
      # under apps/<app>/ and copies the single root package.json + lockfile.
      #
      # Built first into the local daemon so it can be scanned BEFORE it is
      # published. The images carry `AutoUpdate=registry` in production, so a
      # vulnerable image that reaches GHCR is already on its way to the host —
      # scanning after the push would be a report, not a gate. The push below
      # rebuilds from the same cache and therefore only uploads layers.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile.prod
          load: true
          tags: mynextscreen-${{ matrix.app }}:scan
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          # Scoped per architecture: one cache key for both would have the two
          # runners overwrite each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

      # `ignore-unfixed` on purpose: an advisory with no upstream fix cannot be
      # acted on here, and blocking every release on one would mean turning the
      # gate off entirely.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mynextscreen-${{ matrix.app }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # No tags here — tagging a per-architecture image would let the last one
      # pushed win. The digest is recorded and the manifest job below tags the
      # pair together.
      - name: Push image by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile.prod
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          # Attach an SBOM and build provenance so a deployed image can be traced
          # back to the commit and its contents listed without unpacking it.
          sbom: true
          provenance: mode=max

      - name: Record digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.app }}-${{ matrix.arch }}-${{ steps.push.outputs.digest }}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.app }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Joins the per-architecture digests of one app into a single tagged manifest
  # list. Until this runs, the digests exist in the registry but no tag points
  # at them, so a half-finished matrix never publishes a one-sided `latest`.
  manifest:
    name: manifest (${{ matrix.app }})
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, player]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image path
        id: meta
        run: echo "image=$(echo 'ghcr.io/${{ github.repository }}/${{ matrix.app }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker tags + labels
        id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: digest-${{ matrix.app }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # The filenames carry app, arch and digest; only the digest is needed.
          sources=$(for f in *; do echo "${{ steps.meta.outputs.image }}@${f##*-}"; done)
          echo "Joining:"; echo "$sources"
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.tags.outputs.json }}') \
            $sources

      - name: Show the published manifest
        run: docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:${{ steps.tags.outputs.version }}
