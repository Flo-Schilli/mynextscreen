name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-test-build:
    name: lint · typecheck · test · build (nx affected)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write # ArtiomTr/jest-coverage-report-action publishes failed-test annotations
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so nx-set-shas can resolve the affected base

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version sync
        run: node scripts/sync-versions.mjs --check

      # Derives NX_BASE / NX_HEAD for `nx affected`. On main pushes the base is
      # the previous successful commit; on PRs it is the merge base with the target.
      - name: Derive nx SHAs
        uses: nrwl/nx-set-shas@v4

      # On the default branch we run the full graph (run-many) so nothing is skipped;
      # on PRs we run only what the change set affects.
      - name: Format check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t format:check
          else
            npx nx run-many -t format:check
          fi

      - name: Lint · typecheck · build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t lint typecheck build
          else
            npx nx run-many -t lint typecheck build
          fi

      # Backend Jest enforces the coverage gate (92/83/84/92) inside jest.config.ts,
      # so a regression fails this step. Frontend uses ng test (Vitest), player vitest.
      - name: Test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t test
          else
            npx nx run-many -t test
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Coverage report PR comment
        if: github.event_name == 'pull_request'
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          working-directory: apps/backend
          package-manager: npm
          # Deps are already installed by the root `npm ci` above; the monorepo has
          # no per-app package.json, so the action's own install step must be skipped.
          skip-step: install
          test-script: jest --coverage
          annotations: failed-tests
          threshold: 92

  docker:
    name: docker (${{ matrix.app }})
    needs: lint-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, player]
    steps:
      - uses: actions/checkout@v6

      - name: Compute image path + version metadata
        id: meta
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="${PKG_VERSION}+sha.${SHORT_SHA}"
          fi
          {
            echo "image=$(echo 'ghcr.io/${{ github.repository }}/${{ matrix.app }}' | tr '[:upper:]' '[:lower:]')"
            echo "app_version=${APP_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Docker tags + labels
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prod images build from the repo-root context (monorepo); the Dockerfile lives
      # under apps/<app>/ and copies the single root package.json + lockfile.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
