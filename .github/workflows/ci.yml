name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-test-build:
    name: lint · test · build (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write # ArtiomTr/jest-coverage-report-action publishes failed-test annotations
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            test: 'npm run test:cov'
          - app: frontend
            test: 'npm run test:cov'
          - app: player
            test: 'npm test'
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check version sync
        if: matrix.app == 'backend'
        working-directory: ${{ github.workspace }}
        run: node scripts/sync-versions.mjs --check

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: ${{ matrix.test }}

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        if: matrix.app == 'backend'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

      - name: Coverage report PR comment
        if: matrix.app == 'backend' && github.event_name == 'pull_request'
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          working-directory: backend
          package-manager: npm
          test-script: npm run test:cov
          annotations: failed-tests
          threshold: 92

  docker:
    name: docker (${{ matrix.app }})
    needs: lint-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, player]
    steps:
      - uses: actions/checkout@v6

      - name: Compute image path + version metadata
        id: meta
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="${PKG_VERSION}+sha.${SHORT_SHA}"
          fi
          {
            echo "image=$(echo 'ghcr.io/${{ github.repository }}/${{ matrix.app }}' | tr '[:upper:]' '[:lower:]')"
            echo "app_version=${APP_VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Docker tags + labels
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
            GIT_COMMIT=${{ steps.meta.outputs.short_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
