name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query still finds an untouched code path.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: analyze (javascript-typescript)
    # Code scanning needs GitHub Advanced Security on a private repository, and
    # without it the upload fails ("Code scanning is not enabled for this
    # repository") after a full, successful analysis. Skipping instead of
    # failing keeps the checks honest; the job starts working by itself if this
    # repository is ever made public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Required for the action's own status reporting; without it the job ends
      # in "Resource not accessible by integration" even when the scan worked.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          # security-extended adds the lower-precision queries; worth the noise
          # on a codebase that handles uploads, auth and multi-tenancy.
          queries: security-extended

      # No build step: the JavaScript/TypeScript analysis reads the sources
      # directly, and building the Nx graph here would only cost minutes.
      - name: Analyse
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:javascript-typescript
