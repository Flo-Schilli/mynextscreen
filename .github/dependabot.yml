# Keeps the lockfile from drifting behind its own ranges again: the 2026-09-27
# audit found several already-fixed advisories open purely because npm update
# had not been run in a while.
version: 2
updates:
  # One entry, because the monorepo has exactly one package.json and one
  # lockfile at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Grouped so a framework bump arrives as one reviewable PR instead of a
    # dozen that cannot be merged independently anyway.
    groups:
      # Angular's peer ranges pin typescript and vitest to narrow windows
      # (@angular/build@21 wants typescript >=5.9 <6.0 and vitest ^4.0.8), so
      # those two cannot move on their own. Grouping them here keeps the
      # unmergeable combination out of the `remaining` group.
      angular:
        patterns:
          - '@angular*'
          - 'angular-eslint'
          - '@analogjs/*'
          - 'typescript'
          - 'vitest'
          - '@vitest/*'
      nestjs:
        patterns:
          - '@nestjs/*'
          - '@nest-lab/*'
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      types:
        patterns:
          - '@types/*'
      remaining:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular*'
          - 'angular-eslint'
          - '@analogjs/*'
          - '@nestjs/*'
          - '@nest-lab/*'
          - 'nx'
          - '@nx/*'
          - '@types/*'
          - 'typescript'
          - 'vitest'
          - '@vitest/*'
    # Deferred major upgrades (tracked as separate migration work). The grouped
    # PR cannot resolve, so it is ignored to stop a red PR being reopened every
    # Monday. Un-ignore with `@dependabot unignore` (or drop the rule) when the
    # migration is scheduled.
    ignore:
      # NestJS 11 -> 12 is blocked upstream: @nest-lab/throttler-storage-redis
      # has no NestJS 12-compatible release yet.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nest-lab/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /apps/frontend
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /apps/player
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /apps/site-agent
    schedule:
      interval: weekly
      day: monday
