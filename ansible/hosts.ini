[local]
localhost ansible_connection=local

[servers]
# Replace with your server hostname or IP
# Example: signage.example.com ansible_user=signage
contabo

[servers:vars]
ansible_become=true
ansible_become_method=sudo
# Required: The domain name for the signage server
# Example: domain_name=signage.example.com
domain_name=signage.schillis.ch
# Required: strong random secret for signing access JWTs. DO NOT commit a real
# value — set via Ansible Vault or --extra-vars (openssl rand -base64 48).
# jwt_access_secret="{{ vault_jwt_access_secret }}"
# Required: comma-separated emails seeded as system super-admins on boot.
super_admin_emails=admin@schillis.ch
# Optional: bootstrap password for the seeded super-admins (else use /set-password).
# super_admin_initial_password="{{ vault_super_admin_initial_password }}"
caddy_site_prefix=70

ffmpeg_video_strip_audio=true
ffmpeg_video_crf=24
ffmpeg_video_maxrate=4M
ffmpeg_video_bufsize=8M